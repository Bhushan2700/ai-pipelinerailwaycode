version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  # API is internal-only; nginx is the ingress.
  api:
    ports: []
    environment:
      - REDIS__URL=redis://redis:6379/0

  worker-questions:
    environment:
      - REDIS__URL=redis://redis:6379/0

  worker-pipeline:
    environment:
      - REDIS__URL=redis://redis:6379/0

